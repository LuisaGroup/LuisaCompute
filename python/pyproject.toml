[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luisa-compute"
version = "2.0.0-alpha"
description = "LuisaCompute Python DSL v2 - A multistage programming system for GPU/CPU compute shaders"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "LuisaCompute Team"}
]
keywords = ["gpu", "compute", "shader", "dsl", "cuda", "vulkan", "metal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # No external dependencies for core DSL
    # Optional dependencies for development/testing
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "black>=22.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/LuisaGroup/LuisaCompute"
Documentation = "https://github.com/LuisaGroup/LuisaCompute/blob/main/python/README.md"
Repository = "https://github.com/LuisaGroup/LuisaCompute.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["luisa*"]

[tool.setuptools.package-data]
luisa = ["py.typed", "*.pyi"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["F403", "F405"] # Allow star imports in DSL

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
