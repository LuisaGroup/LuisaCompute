name: check-llvm-downgrade-pin

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pin:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check committed llvm-downgrade pin
        run: python scripts/check_llvm_downgrade_pin.py --ref HEAD
      - name: Test pin guard and hooks
        run: python scripts/test_llvm_downgrade_pin.py
