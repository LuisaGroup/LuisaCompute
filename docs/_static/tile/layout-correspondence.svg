<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Layout correspondence with explicit replicas</title>
  <desc id="desc">An occurrence space maps to logical coordinates on one side and physical slots on the other. Two occurrences per logical element express replication without assuming a unique inverse.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .title { font-size: 27px; font-weight: 700; }
      .heading { font-size: 18px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; fill: #475569; }
      .left-link { fill: none; stroke: #10b981; stroke-width: 2; marker-end: url(#arrow); }
      .right-link { fill: none; stroke: #8b5cf6; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="10" y="10" width="1180" height="600" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="50" text-anchor="middle" class="title">A correspondence represents placement without inventing an inverse</text>

  <text x="155" y="100" text-anchor="middle" class="heading">Logical X</text>
  <text x="155" y="122" text-anchor="middle" class="small">what values exist</text>
  <text x="600" y="100" text-anchor="middle" class="heading">Occurrence F = X × Replica</text>
  <text x="600" y="122" text-anchor="middle" class="small">each concrete copy has an identity</text>
  <text x="1045" y="100" text-anchor="middle" class="heading">Physical P</text>
  <text x="1045" y="122" text-anchor="middle" class="small">where copies are placed</text>

  <rect x="85" y="174" width="140" height="58" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="155" y="209" text-anchor="middle" class="label">x0</text>
  <rect x="85" y="282" width="140" height="58" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="155" y="317" text-anchor="middle" class="label">x1</text>
  <rect x="85" y="390" width="140" height="58" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="155" y="425" text-anchor="middle" class="label">x2</text>

  <rect x="505" y="150" width="190" height="48" rx="9" fill="#ffffff" stroke="#64748b"/>
  <text x="600" y="180" text-anchor="middle" class="label">(x0, replica 0)</text>
  <rect x="505" y="212" width="190" height="48" rx="9" fill="#ffffff" stroke="#64748b"/>
  <text x="600" y="242" text-anchor="middle" class="label">(x0, replica 1)</text>
  <rect x="505" y="274" width="190" height="48" rx="9" fill="#ffffff" stroke="#64748b"/>
  <text x="600" y="304" text-anchor="middle" class="label">(x1, replica 0)</text>
  <rect x="505" y="336" width="190" height="48" rx="9" fill="#ffffff" stroke="#64748b"/>
  <text x="600" y="366" text-anchor="middle" class="label">(x1, replica 1)</text>
  <rect x="505" y="398" width="190" height="48" rx="9" fill="#ffffff" stroke="#64748b"/>
  <text x="600" y="428" text-anchor="middle" class="label">(x2, replica 0)</text>
  <rect x="505" y="460" width="190" height="48" rx="9" fill="#ffffff" stroke="#64748b"/>
  <text x="600" y="490" text-anchor="middle" class="label">(x2, replica 1)</text>

  <rect x="975" y="150" width="140" height="48" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1045" y="180" text-anchor="middle" class="label">slot p0</text>
  <rect x="975" y="212" width="140" height="48" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1045" y="242" text-anchor="middle" class="label">slot p3</text>
  <rect x="975" y="274" width="140" height="48" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1045" y="304" text-anchor="middle" class="label">slot p1</text>
  <rect x="975" y="336" width="140" height="48" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1045" y="366" text-anchor="middle" class="label">slot p4</text>
  <rect x="975" y="398" width="140" height="48" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1045" y="428" text-anchor="middle" class="label">slot p2</text>
  <rect x="975" y="460" width="140" height="48" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1045" y="490" text-anchor="middle" class="label">slot p5</text>

  <path d="M505 174 C390 174 340 203 225 203" class="left-link"/>
  <path d="M505 236 C390 236 340 203 225 203" class="left-link"/>
  <path d="M505 298 C390 298 340 311 225 311" class="left-link"/>
  <path d="M505 360 C390 360 340 311 225 311" class="left-link"/>
  <path d="M505 422 C390 422 340 419 225 419" class="left-link"/>
  <path d="M505 484 C390 484 340 419 225 419" class="left-link"/>

  <path d="M695 174 L975 174" class="right-link"/>
  <path d="M695 236 L975 236" class="right-link"/>
  <path d="M695 298 L975 298" class="right-link"/>
  <path d="M695 360 L975 360" class="right-link"/>
  <path d="M695 422 L975 422" class="right-link"/>
  <path d="M695 484 L975 484" class="right-link"/>

  <text x="350" y="153" text-anchor="middle" class="label" fill="#047857">left: F → X</text>
  <text x="830" y="153" text-anchor="middle" class="label" fill="#7c3aed">right: F → P</text>
  <rect x="330" y="538" width="540" height="48" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="600" y="558" text-anchor="middle" class="label">Swap the two legs to change orientation.</text>
  <text x="600" y="577" text-anchor="middle" class="small">No many-to-one leg is ever treated as a unique inverse.</text>
</svg>
