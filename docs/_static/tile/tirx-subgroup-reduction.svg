<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">TIRx Metal subgroup reduction planning and realization</title>
  <desc id="desc">A logical row program passes semantic and ownership proofs, then a bounded cost solver chooses packed independent subgroups or several cooperating subgroups. Global tensor views, worker-private stripes, shared reduction partials and the final output remain separate resources.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #172b4d; }
      .head { font: 700 16px system-ui, sans-serif; fill: #172b4d; }
      .text { font: 14px system-ui, sans-serif; fill: #243b53; }
      .small { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334e68; }
      .box { stroke-width: 2; rx: 14; ry: 14; }
      .arrow { stroke: #52606d; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #829ab1; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#f7f9fc"/>
  <text x="600" y="36" text-anchor="middle" class="title">Logical execution → proof → finite search → Metal realization</text>

  <rect x="35" y="75" width="220" height="116" class="box" fill="#e3f2fd" stroke="#2684ff"/>
  <text x="145" y="103" text-anchor="middle" class="head">TileIR row program</text>
  <text x="55" y="132" class="text">P independent programs</text>
  <text x="55" y="156" class="text">N elements per row</text>
  <text x="55" y="178" class="small">reduce / element domains / effects</text>

  <rect x="310" y="65" width="255" height="136" class="box" fill="#e8f5e9" stroke="#36b37e"/>
  <text x="438" y="94" text-anchor="middle" class="head">Fail-closed proof gates</text>
  <text x="330" y="121" class="text">exact FP32 add / max / min</text>
  <text x="330" y="145" class="text">pure contribution + uniform control</text>
  <text x="330" y="169" class="text">partitioned stores + noalias views</text>
  <text x="330" y="191" class="small">affine owner equality for cached Tiles</text>

  <rect x="620" y="75" width="235" height="116" class="box" fill="#fff3e0" stroke="#ff991f"/>
  <text x="738" y="103" text-anchor="middle" class="head">Bounded cost solver</text>
  <text x="640" y="132" class="small">S ∈ {1, 2, 4, 8}</text>
  <text x="640" y="155" class="text">hard limits before ranking</text>
  <text x="640" y="178" class="small">rounds + collective + group setup</text>
  <rect x="910" y="75" width="255" height="116" class="box" fill="#f3e5f5" stroke="#8777d9"/>
  <text x="1038" y="103" text-anchor="middle" class="head">Verified execution plan</text>
  <text x="930" y="132" class="text">threads, blocks, S/program</text>
  <text x="930" y="155" class="text">shared/private scalar budgets</text>
  <text x="930" y="178" class="small">cost basis + barrier sites</text>

  <path d="M255 133 H310" class="arrow"/>
  <path d="M565 133 H620" class="arrow"/>
  <path d="M855 133 H910" class="arrow"/>

  <rect x="65" y="260" width="475" height="190" class="box" fill="#edf7ff" stroke="#2684ff"/>
  <text x="303" y="291" text-anchor="middle" class="head">S = 1: pack independent programs</text>
  <text x="90" y="322" class="small">threadgroup = Q independent SIMD-groups</text>
  <text x="90" y="348" class="small">program p = block · Q + subgroup</text>
  <text x="90" y="374" class="small">element e = chunk · 32 + lane</text>
  <rect x="90" y="398" width="92" height="30" rx="7" fill="#bbdefb" stroke="#2684ff"/>
  <rect x="194" y="398" width="92" height="30" rx="7" fill="#bbdefb" stroke="#2684ff"/>
  <rect x="298" y="398" width="92" height="30" rx="7" fill="#bbdefb" stroke="#2684ff"/>
  <rect x="402" y="398" width="92" height="30" rx="7" fill="#bbdefb" stroke="#2684ff"/>
  <text x="136" y="418" text-anchor="middle" class="small">program p</text>
  <text x="240" y="418" text-anchor="middle" class="small">program p+1</text>
  <text x="344" y="418" text-anchor="middle" class="small">program p+2</text>
  <text x="448" y="418" text-anchor="middle" class="small">…</text>

  <rect x="660" y="260" width="475" height="190" class="box" fill="#fff8e6" stroke="#ff991f"/>
  <text x="898" y="291" text-anchor="middle" class="head">S &gt; 1: cooperate on one program</text>
  <text x="685" y="322" class="small">worker w = subgroup · 32 + lane</text>
  <text x="685" y="348" class="small">element e = chunk · (32S) + w</text>
  <text x="685" y="374" class="text">local fold → SIMD collective → shared partial[S]</text>
  <rect x="690" y="397" width="95" height="32" rx="7" fill="#ffe0b2" stroke="#ff991f"/>
  <rect x="800" y="397" width="95" height="32" rx="7" fill="#ffe0b2" stroke="#ff991f"/>
  <rect x="910" y="397" width="95" height="32" rx="7" fill="#ffe0b2" stroke="#ff991f"/>
  <rect x="1020" y="397" width="85" height="32" rx="7" fill="#ffe0b2" stroke="#ff991f"/>
  <text x="738" y="418" text-anchor="middle" class="small">partial 0</text>
  <text x="848" y="418" text-anchor="middle" class="small">partial 1</text>
  <text x="958" y="418" text-anchor="middle" class="small">partial 2</text>
  <text x="1063" y="418" text-anchor="middle" class="small">…</text>
  <text x="898" y="445" text-anchor="middle" class="small">barrier → one uniform collective over S partials</text>

  <path d="M1038 191 C1038 225 303 220 303 260" class="thin"/>
  <path d="M1038 191 V260" class="thin"/>

  <rect x="85" y="515" width="1030" height="100" class="box" fill="#ffffff" stroke="#829ab1"/>
  <text x="600" y="542" text-anchor="middle" class="head">Resource mapping remains separate from execution</text>
  <rect x="115" y="558" width="190" height="36" rx="8" fill="#d9e2ec" stroke="#627d98"/>
  <text x="210" y="581" text-anchor="middle" class="text">global Tensor views</text>
  <rect x="385" y="558" width="210" height="36" rx="8" fill="#c6f6d5" stroke="#36b37e"/>
  <text x="490" y="581" text-anchor="middle" class="text">worker-private stripe[k]</text>
  <rect x="675" y="558" width="190" height="36" rx="8" fill="#ffe0b2" stroke="#ff991f"/>
  <text x="770" y="581" text-anchor="middle" class="text">shared partial[S]</text>
  <rect x="945" y="558" width="140" height="36" rx="8" fill="#e1d5f7" stroke="#8777d9"/>
  <text x="1015" y="581" text-anchor="middle" class="text">global output</text>
  <path d="M305 576 H385" class="arrow"/>
  <path d="M595 576 H675" class="arrow"/>
  <path d="M865 576 H945" class="arrow"/>
  <text x="600" y="637" text-anchor="middle" class="small">A logical Tile is compacted only after proving flatten(index) = distributed element; its local slot is floor(element / 32S).</text>
</svg>
