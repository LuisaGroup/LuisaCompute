<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Execution-to-memory mapping</title>
  <desc id="desc">An execution event selects a resource instance and owner-local allocation base. Access, view, version, and address maps select an offset within that allocation. The final physical access combines both coordinates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .title { font-size: 27px; font-weight: 700; }
      .heading { font-size: 17px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 11; }
      .link { fill: none; stroke: #64748b; stroke-width: 2.1; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="10" y="10" width="1260" height="700" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="640" y="50" text-anchor="middle" class="title">A physical access is two independently checked coordinates</text>

  <rect x="35" y="88" width="940" height="230" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="60" y="120" class="heading" fill="#1d4ed8">1 · Select the resource instance and allocation slice</text>

  <rect x="68" y="160" width="135" height="58" class="box" fill="#ffffff" stroke="#2563eb"/>
  <text x="135" y="184" text-anchor="middle" class="label">event e</text>
  <text x="135" y="204" text-anchor="middle" class="small">(nest, subnest, leaf)</text>

  <rect x="270" y="128" width="170" height="54" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="355" y="151" text-anchor="middle" class="label">owner projection</text>
  <text x="355" y="169" text-anchor="middle" class="small">pi_owner(e)</text>
  <path d="M203 178 L270 159" class="link"/>

  <rect x="505" y="128" width="170" height="54" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="590" y="151" text-anchor="middle" class="label">Instance_s + Base_s</text>
  <text x="590" y="169" text-anchor="middle" class="small">logical owner → placement</text>
  <path d="M440 155 L505 155" class="link"/>

  <rect x="270" y="226" width="170" height="54" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="355" y="249" text-anchor="middle" class="label">ExecBinding_b</text>
  <text x="355" y="267" text-anchor="middle" class="small">logical → target axes</text>
  <path d="M203 202 L270 239" class="link"/>

  <rect x="505" y="226" width="170" height="54" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="590" y="249" text-anchor="middle" class="label">ResourceTopology</text>
  <text x="590" y="267" text-anchor="middle" class="small">target axes → instance</text>
  <path d="M440 253 L505 253" class="link"/>

  <rect x="755" y="168" width="180" height="72" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="845" y="197" text-anchor="middle" class="heading">instance + base</text>
  <text x="845" y="220" text-anchor="middle" class="small">instance paths must agree</text>
  <path d="M675 155 C720 155 720 187 755 187" class="link"/>
  <path d="M675 253 C720 253 720 220 755 220" class="link"/>
  <text x="716" y="146" text-anchor="middle" class="small">=</text>

  <rect x="35" y="340" width="940" height="292" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="60" y="373" class="heading" fill="#047857">2 · Select the byte inside that instance</text>

  <rect x="68" y="414" width="135" height="58" class="box" fill="#ffffff" stroke="#10b981"/>
  <text x="135" y="438" text-anchor="middle" class="label">(e, local u)</text>
  <text x="135" y="458" text-anchor="middle" class="small">one access event</text>
  <rect x="270" y="416" width="150" height="54" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="345" y="449" text-anchor="middle" class="label">Access_use</text>
  <path d="M203 443 L270 443" class="link"/>
  <rect x="485" y="416" width="150" height="54" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="560" y="439" text-anchor="middle" class="label">ViewMap</text>
  <text x="560" y="457" text-anchor="middle" class="small">→ storage coord</text>
  <path d="M420 443 L485 443" class="link"/>

  <rect x="68" y="528" width="135" height="58" class="box" fill="#ffffff" stroke="#eab308"/>
  <text x="135" y="552" text-anchor="middle" class="label">(state, time)</text>
  <text x="135" y="572" text-anchor="middle" class="small">reaching MemorySSA</text>
  <rect x="270" y="530" width="150" height="54" class="box" fill="#fefce8" stroke="#eab308"/>
  <text x="345" y="553" text-anchor="middle" class="label">Version_s</text>
  <text x="345" y="571" text-anchor="middle" class="small">→ version coord</text>
  <path d="M203 557 L270 557" class="link"/>

  <rect x="720" y="452" width="170" height="74" rx="12" fill="#ffffff" stroke="#059669" stroke-width="3"/>
  <text x="805" y="482" text-anchor="middle" class="heading">Address_s</text>
  <text x="805" y="505" text-anchor="middle" class="small">(version, storage) → local offset</text>
  <path d="M635 443 C682 443 682 471 720 471" class="link"/>
  <path d="M420 557 C610 557 640 508 720 508" class="link"/>

  <rect x="1015" y="389" width="220" height="92" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="1125" y="421" text-anchor="middle" class="heading">Physical access</text>
  <text x="1125" y="447" text-anchor="middle" class="label">(instance, base + offset)</text>
  <text x="1125" y="467" text-anchor="middle" class="small">total + single-valued</text>
  <path d="M935 204 C1000 204 995 400 1015 413" class="link"/>
  <path d="M890 489 C960 489 970 457 1015 451" class="link"/>

  <rect x="335" y="655" width="610" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="640" y="680" text-anchor="middle" class="label">Owner placement chooses instance + base; view + version choose the local offset.</text>
</svg>
