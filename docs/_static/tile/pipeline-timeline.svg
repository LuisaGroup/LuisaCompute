<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
  <title id="title">Modulo pipeline timeline</title>
  <desc id="desc">Load, compute, and store stages for three iterations overlap on different engines with initiation interval one. Memory versions follow liveness rather than stage count or maximum in-flight iterations.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .title { font-size: 27px; font-weight: 700; }
      .heading { font-size: 16px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 700; }
      .small { font-size: 12px; fill: #475569; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
    </style>
  </defs>
  <rect x="10" y="10" width="1260" height="570" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="640" y="50" text-anchor="middle" class="title">Pipeline is time over an execution region, not a memory level</text>
  <text x="640" y="76" text-anchor="middle" class="small">k.stage("load") → k.stage("compute") → k.stage("store"); II = 1</text>

  <text x="190" y="112" text-anchor="end" class="small">logical issue time</text>
  <line x1="220" y1="118" x2="1160" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <g class="small" text-anchor="middle">
    <text x="260" y="108">0</text><text x="400" y="108">1</text><text x="540" y="108">2</text>
    <text x="680" y="108">3</text><text x="820" y="108">4</text><text x="960" y="108">5</text><text x="1100" y="108">6</text>
  </g>
  <g>
    <line x1="260" y1="124" x2="260" y2="480" class="grid"/>
    <line x1="400" y1="124" x2="400" y2="480" class="grid"/>
    <line x1="540" y1="124" x2="540" y2="480" class="grid"/>
    <line x1="680" y1="124" x2="680" y2="480" class="grid"/>
    <line x1="820" y1="124" x2="820" y2="480" class="grid"/>
    <line x1="960" y1="124" x2="960" y2="480" class="grid"/>
    <line x1="1100" y1="124" x2="1100" y2="480" class="grid"/>
  </g>

  <text x="190" y="177" text-anchor="end" class="heading">copy engine</text>
  <text x="190" y="277" text-anchor="end" class="heading">MMA engine</text>
  <text x="190" y="377" text-anchor="end" class="heading">store engine</text>
  <text x="190" y="467" text-anchor="end" class="heading">live versions</text>

  <rect x="270" y="146" width="110" height="54" rx="9" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <text x="325" y="178" text-anchor="middle" class="label">load 0</text>
  <rect x="410" y="146" width="110" height="54" rx="9" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <text x="465" y="178" text-anchor="middle" class="label">load 1</text>
  <rect x="550" y="146" width="110" height="54" rx="9" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
  <text x="605" y="178" text-anchor="middle" class="label">load 2</text>

  <rect x="410" y="240" width="240" height="64" rx="10" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="530" y="277" text-anchor="middle" class="label">mma 0</text>
  <rect x="550" y="240" width="240" height="64" rx="10" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/>
  <text x="670" y="277" text-anchor="middle" class="label">mma 1</text>
  <rect x="690" y="240" width="240" height="64" rx="10" fill="#a78bfa" stroke="#6d28d9" stroke-width="2"/>
  <text x="810" y="277" text-anchor="middle" class="label" fill="#ffffff">mma 2</text>

  <rect x="700" y="346" width="110" height="54" rx="9" fill="#bbf7d0" stroke="#10b981" stroke-width="2"/>
  <text x="755" y="378" text-anchor="middle" class="label">store 0</text>
  <rect x="840" y="346" width="110" height="54" rx="9" fill="#bbf7d0" stroke="#10b981" stroke-width="2"/>
  <text x="895" y="378" text-anchor="middle" class="label">store 1</text>
  <rect x="980" y="346" width="110" height="54" rx="9" fill="#bbf7d0" stroke="#10b981" stroke-width="2"/>
  <text x="1035" y="378" text-anchor="middle" class="label">store 2</text>

  <rect x="270" y="435" width="360" height="48" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="450" y="464" text-anchor="middle" class="label">A/B version 0 live</text>
  <rect x="410" y="491" width="360" height="48" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="590" y="520" text-anchor="middle" class="label">A/B version 1 live</text>
  <rect x="550" y="435" width="360" height="48" rx="8" fill="#ffedd5" stroke="#f97316"/>
  <text x="730" y="464" text-anchor="middle" class="label">A/B version 2 live</text>

  <path d="M270 132 L410 132" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="340" y="128" text-anchor="middle" class="small">II = 1</text>
  <rect x="940" y="488" width="250" height="58" rx="10" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
  <text x="1065" y="511" text-anchor="middle" class="label">Version count comes from liveness</text>
  <text x="1065" y="532" text-anchor="middle" class="small">not directly from max_in_flight = 3</text>
</svg>
