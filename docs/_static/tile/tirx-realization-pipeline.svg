<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Structural TileIR to TIRx lowering and target realization</title>
  <desc id="desc">Verified TileIR is structurally exported to TIRx. Semantic proofs attach versioned contracts and choose compiler-owned materialization. Target planners then select portable loops, CPU provider atoms, or Metal matrix atoms. Every provider revalidates the actual TIRx body, ABI, layout, aliasing and numerical policy before code generation.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#0f172a}
      .title{font-size:25px;font-weight:700}.head{font-size:18px;font-weight:650}.label{font-size:15px}.small{font-size:13px;fill:#475569}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#f0fdf4;stroke:#86bfa0;stroke-width:2}.amber{fill:#fffbeb;stroke:#d6a84b;stroke-width:2}
      .edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="10" y="10" width="1180" height="670" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="47" text-anchor="middle" class="title">One semantic export, several proved target realizations</text>

  <rect x="70" y="75" width="1060" height="82" rx="10" class="blue"/>
  <text x="95" y="106" class="head">Verified mutable TileIR</text>
  <text x="95" y="132" class="label">execution Nests · typed SSA/use graph · views/layouts · explicit effects · numerical policy</text>

  <path d="M600 157 V186" class="edge"/>
  <rect x="70" y="188" width="1060" height="112" rx="10" class="box"/>
  <text x="95" y="219" class="head">Shared structural TileIR → TIRx export</text>
  <text x="95" y="246" class="label">Preserve logical loops and typed operations; materialize shared expensive Tile SSA once when reuse requires it</text>
  <text x="95" y="271" class="label">Attach versioned proof contracts for exact whole GEMM, reduction recurrences, and shared FP32 exp maps</text>
  <text x="95" y="291" class="small">Operation names are not authority; contracts come from TileIR structure and dataflow.</text>

  <path d="M600 300 V329" class="edge"/>
  <rect x="45" y="332" width="330" height="150" rx="10" class="box"/>
  <text x="68" y="363" class="head">Portable reference family</text>
  <text x="68" y="390" class="label">serial recurrence + LLVM SIMD packs</text>
  <text x="68" y="415" class="label">CPU task threshold + full/tail versioning</text>
  <text x="68" y="440" class="label">ordinary GPU grid/group mapping</text>
  <text x="68" y="465" class="small">Always remains the semantic control.</text>

  <rect x="435" y="332" width="330" height="150" rx="10" class="green"/>
  <text x="458" y="363" class="head">CPU provider family (opt-in)</text>
  <text x="458" y="390" class="label">whole compact FP32 GEMM → CBLAS</text>
  <text x="458" y="415" class="label">add/max/min reduction → vDSP</text>
  <text x="458" y="440" class="label">shared compact FP32 exp → vForce</text>
  <text x="458" y="465" class="small">Target policy records relaxed provider semantics.</text>

  <rect x="825" y="332" width="330" height="150" rx="10" class="amber"/>
  <text x="848" y="363" class="head">Metal matrix families</text>
  <text x="848" y="390" class="label">reference SIMD-group tensorization</text>
  <text x="848" y="415" class="label">TIRx MPP memory-input atom</text>
  <text x="848" y="440" class="label">native backend MPP atom</text>
  <text x="848" y="465" class="small">Capability, layout and participation are explicit.</text>

  <path d="M210 482 V519 H600" class="edge"/>
  <path d="M600 482 V519" class="edge"/>
  <path d="M990 482 V519 H600" class="edge"/>
  <rect x="200" y="522" width="800" height="82" rx="10" class="box"/>
  <text x="225" y="553" class="head">Target-side proof firewall</text>
  <text x="225" y="579" class="label">Revalidate the actual TIRx body + typed ABI + compact/strided layout + noalias + target capability + numerical contract</text>
  <text x="225" y="598" class="small">No match: keep reference semantics when allowed. Explicit unsupported provider request: diagnose and fail closed.</text>

  <path d="M600 604 V629" class="edge"/>
  <rect x="315" y="632" width="570" height="35" rx="8" class="blue"/>
  <text x="600" y="655" text-anchor="middle" class="label">TVM C++ codegen/runtime or Luisa backend shader + ordinary Stream launch</text>
  <text x="1130" y="684" text-anchor="end" class="small">External symbol strings appear only at the provider ABI boundary.</text>
</svg>
