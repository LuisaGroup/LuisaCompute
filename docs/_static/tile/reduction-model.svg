<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Reduction region semantics and scheduling</title>
  <desc id="desc">A typed reduction domain and body-captured Tile updates form semantic contributions and inferred states. A grouping projection and reducer contract define the result. Independently, a layout map places reduction coordinates across participant fibers and serial steps.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 17px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; fill: #475569; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect x="10" y="10" width="1260" height="700" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="640" y="49" text-anchor="middle" class="title">Reduction: algebra first, physical collective later</text>
  <text x="640" y="75" text-anchor="middle" class="small">A reduction region is nest-like, but it never becomes a memory-owner prefix</text>

  <text x="42" y="116" class="heading">Candidate TileIR semantics</text>

  <rect x="42" y="140" width="226" height="126" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="170" text-anchor="middle" class="heading">Reduction domain</text>
  <text x="155" y="200" text-anchor="middle" class="code">typed IndexSet R</text>
  <text x="155" y="225" text-anchor="middle" class="small">Tile axis or explicit range</text>
  <text x="155" y="248" text-anchor="middle" class="small">typed dimensions, masks included</text>

  <path d="M268 203 L316 203" class="arrow"/>

  <rect x="320" y="140" width="226" height="126" rx="14" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="433" y="170" text-anchor="middle" class="heading">Contributions Ω</text>
  <text x="433" y="200" text-anchor="middle" class="code">captured body updates</text>
  <text x="433" y="225" text-anchor="middle" class="small">outer Tile states are inferred</text>
  <text x="433" y="248" text-anchor="middle" class="small">inactive masks contribute identity</text>

  <path d="M546 203 L594 203" class="arrow"/>

  <rect x="598" y="122" width="282" height="162" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="739" y="153" text-anchor="middle" class="heading">Grouping + reducer</text>
  <text x="739" y="183" text-anchor="middle" class="code">group : Ω → result coord</text>
  <text x="739" y="211" text-anchor="middle" class="code">(identity, update, merge)</text>
  <text x="739" y="238" text-anchor="middle" class="small">associativity · type · accuracy</text>
  <text x="739" y="261" text-anchor="middle" class="small">determinism / reassociation policy</text>

  <path d="M880 203 L928 203" class="arrow"/>

  <rect x="932" y="140" width="306" height="126" rx="14" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1085" y="170" text-anchor="middle" class="heading">Logical result</text>
  <text x="1085" y="199" text-anchor="middle" class="code">result[g] = init[g] ⊕ Ωg</text>
  <text x="1085" y="225" text-anchor="middle" class="small">reduced axes disappear</text>
  <text x="1085" y="248" text-anchor="middle" class="small">remaining dimensions may stay distributed</text>

  <path d="M42 337 L1238 337" class="dash"/>
  <text x="42" y="373" class="heading">Scheduled realization</text>
  <text x="1238" y="373" text-anchor="end" class="small">chosen after execution binding and layout inference</text>

  <rect x="42" y="400" width="350" height="150" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="217" y="432" text-anchor="middle" class="heading">Reduction placement layout</text>
  <text x="217" y="466" text-anchor="middle" class="code">R → participant fiber × serial step</text>
  <text x="217" y="496" text-anchor="middle" class="small">split · permute · vectorize · predicate</text>
  <text x="217" y="523" text-anchor="middle" class="small">does not alter memory ownership</text>

  <path d="M392 475 L442 475" class="arrow"/>

  <rect x="446" y="400" width="304" height="150" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="598" y="432" text-anchor="middle" class="heading">Partial states + merge plan</text>
  <text x="598" y="466" text-anchor="middle" class="code">occurrences → result occurrences</text>
  <text x="598" y="496" text-anchor="middle" class="small">tree topology and communication</text>
  <text x="598" y="523" text-anchor="middle" class="small">repartition is explicit when needed</text>

  <path d="M750 475 L800 475" class="arrow"/>

  <rect x="804" y="400" width="434" height="246" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1021" y="432" text-anchor="middle" class="heading">Target-selected collective</text>

  <rect x="838" y="458" width="162" height="48" rx="24" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="919" y="488" text-anchor="middle" class="label">lane shuffle tree</text>
  <rect x="1034" y="458" width="170" height="48" rx="24" fill="#f0fdf4" stroke="#34d399"/>
  <text x="1119" y="488" text-anchor="middle" class="label">shared-memory tree</text>

  <rect x="838" y="528" width="162" height="48" rx="24" fill="#faf5ff" stroke="#a78bfa"/>
  <text x="919" y="558" text-anchor="middle" class="label">SIMD horizontal</text>
  <rect x="1034" y="528" width="170" height="48" rx="24" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1119" y="558" text-anchor="middle" class="label">ordered serial loop</text>

  <rect x="936" y="592" width="170" height="36" rx="18" fill="#ffffff" stroke="#64748b"/>
  <text x="1021" y="615" text-anchor="middle" class="small">or a spatial / temporal hybrid</text>

  <text x="42" y="677" class="code">for (auto &amp;r : nest.reduce(x.domain(dim), reducer?)) { state = update(state, x.at(r)); }</text>
</svg>
