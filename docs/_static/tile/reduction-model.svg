<svg xmlns="http://www.w3.org/2000/svg" width="560" height="742" viewBox="0 0 560 742" role="img" aria-labelledby="title desc">
  <title id="title">Reduction contract before physical mapping</title>
  <desc id="desc">Active contributions are grouped into results. The proposed default permits unordered trees. Explicit policies restrict evaluation to ordered trees or strict left and right folds. The compiler jointly chooses participants, distribution, storage and schedule while counting each contribution and the seed once.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .title { font-size: 22px; font-weight: 700; }
      .heading { font-size: 17px; font-weight: 650; }
      .body { font-size: 14px; }
      .small { font-size: 13px; fill: #475569; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="558" height="740" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="280" y="33" text-anchor="middle" class="title">Reduction: contract, then mapping</text>
  <text x="280" y="56" text-anchor="middle" class="small">One nest primitive; no new memory-owner level</text>

  <rect x="18" y="78" width="524" height="112" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="280" y="105" text-anchor="middle" class="heading">Logical contributions + captured state</text>
  <text x="280" y="131" text-anchor="middle" class="body">Domain, grouping, update and incoming seed</text>
  <text x="280" y="154" text-anchor="middle" class="body">Source order is independent of layout and worker IDs</text>
  <text x="280" y="176" text-anchor="middle" class="small">Masked occurrences are absent; replicas are not extra inputs</text>

  <path d="M280 190 V209 M98 209 H462" class="line"/>
  <path d="M98 209 V229" class="arrow"/>
  <path d="M280 209 V229" class="arrow"/>
  <path d="M462 209 V229" class="arrow"/>

  <rect x="18" y="234" width="160" height="168" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="98" y="261" text-anchor="middle" class="heading">Default</text>
  <text x="98" y="290" text-anchor="middle" class="code">unordered_tree</text>
  <text x="98" y="320" text-anchor="middle" class="body">Regroup + permute</text>
  <text x="98" y="343" text-anchor="middle" class="body">Compatible merge</text>
  <text x="98" y="378" text-anchor="middle" class="small">FP order may vary</text>

  <rect x="200" y="234" width="160" height="168" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="280" y="261" text-anchor="middle" class="heading">Explicit</text>
  <text x="280" y="290" text-anchor="middle" class="code">ordered_tree</text>
  <text x="280" y="320" text-anchor="middle" class="body">Regroup only</text>
  <text x="280" y="343" text-anchor="middle" class="body">Preserve leaf order</text>
  <text x="280" y="378" text-anchor="middle" class="small">Compatible merge</text>

  <rect x="382" y="234" width="160" height="168" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="462" y="261" text-anchor="middle" class="heading">Explicit</text>
  <text x="462" y="290" text-anchor="middle" class="code">fold_left / right</text>
  <text x="462" y="320" text-anchor="middle" class="body">Keep update chain</text>
  <text x="462" y="343" text-anchor="middle" class="body">Keep operand order</text>
  <text x="462" y="378" text-anchor="middle" class="small">No merge required</text>

  <path d="M98 402 V423 H462 V402 M280 402 V423" class="line"/>
  <path d="M280 423 V454" class="arrow"/>

  <rect x="18" y="459" width="524" height="158" rx="10" fill="#ffffff" stroke="#64748b"/>
  <text x="280" y="490" text-anchor="middle" class="heading">Joint physical realization</text>
  <text x="280" y="518" text-anchor="middle" class="body">Participants · distribution · storage · schedule</text>
  <text x="280" y="548" text-anchor="middle" class="body">Trees: shuffle / shared / SIMD / serial / hybrid</text>
  <text x="280" y="574" text-anchor="middle" class="body">Strict fold: chain within each independent output group</text>
  <text x="280" y="601" text-anchor="middle" class="small">Permission does not force a particular hardware algorithm</text>

  <rect x="18" y="638" width="524" height="84" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="280" y="663" text-anchor="middle" class="body">Always: seed once · each active contribution once</text>
  <text x="280" y="686" text-anchor="middle" class="small">No implicit precision change or exceptional-value relaxation</text>
  <text x="280" y="709" text-anchor="middle" class="small">Design default; current Metal tree support is still opt-in</text>
</svg>
