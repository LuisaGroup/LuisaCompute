<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline stage cuts, dependence graph, and late binding</title>
  <desc id="desc">Cursor calls partition one C++ body into load, compute, and store subregions. SSA and effect dependences connect the segments across iterations. A later target schedule binds active participants and engines independently.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 18px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      .small { font-size: 12px; fill: #475569; }
      .link { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .dep { fill: none; stroke: #7c3aed; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="10" y="10" width="1260" height="700" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="640" y="50" text-anchor="middle" class="title">A pipeline is source segments + dependences + a late schedule</text>
  <text x="205" y="94" text-anchor="middle" class="heading">C++ capture</text>
  <text x="640" y="94" text-anchor="middle" class="heading">Candidate TileIR</text>
  <text x="1065" y="94" text-anchor="middle" class="heading">Target schedule</text>

  <rect x="36" y="116" width="338" height="454" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="58" y="149" class="code">for (auto &amp;k : subnest.pipeline(...)) {</text>
  <text x="76" y="180" class="code">auto k0 = k.index();</text>

  <rect x="58" y="202" width="294" height="112" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="76" y="228" class="code">k.stage("load");</text>
  <text x="76" y="258" class="code">auto a = load_a(k0);</text>
  <text x="76" y="284" class="code">auto b = load_b(k0);</text>

  <rect x="58" y="330" width="294" height="96" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="76" y="356" class="code">k.stage("compute");</text>
  <text x="76" y="386" class="code">acc = mma(a, b, acc);</text>

  <rect x="58" y="442" width="294" height="82" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="76" y="468" class="code">k.stage("store");</text>
  <text x="76" y="498" class="code">store(acc);</text>
  <text x="58" y="550" class="code">}</text>

  <path d="M374 262 L443 262" class="link"/>
  <path d="M374 378 L443 378" class="link"/>
  <path d="M374 483 L443 483" class="link"/>

  <rect x="446" y="116" width="388" height="454" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="640" y="146" text-anchor="middle" class="small">subregion id = (PipelineId, ordinal)</text>

  <rect x="492" y="185" width="136" height="62" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="560" y="211" text-anchor="middle" class="label">load i</text>
  <text x="560" y="231" text-anchor="middle" class="small">produce a, b</text>
  <rect x="652" y="303" width="136" height="62" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="720" y="329" text-anchor="middle" class="label">compute i</text>
  <text x="720" y="349" text-anchor="middle" class="small">consume a, b</text>
  <rect x="492" y="421" width="136" height="62" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="560" y="447" text-anchor="middle" class="label">store i</text>
  <text x="560" y="467" text-anchor="middle" class="small">consume acc</text>

  <path d="M606 247 C620 275 650 292 681 307" class="dep"/>
  <text x="622" y="276" class="small">Tile SSA edge</text>
  <path d="M681 365 C650 391 620 407 606 421" class="dep"/>
  <rect x="652" y="432" width="136" height="52" rx="10" fill="#faf5ff" stroke="#eab308" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="720" y="463" text-anchor="middle" class="label">compute i+1</text>
  <path d="M760 365 C800 390 800 410 760 432" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="796" y="404" class="small">distance 1: acc</text>

  <path d="M834 216 L896 216" class="link"/>
  <path d="M834 334 L896 334" class="link"/>
  <path d="M834 452 L896 452" class="link"/>

  <rect x="900" y="116" width="344" height="454" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="932" y="174" width="280" height="86" rx="11" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1072" y="204" text-anchor="middle" class="label">Active(load) + copy engine</text>
  <text x="1072" y="230" text-anchor="middle" class="small">logical producer child domain</text>

  <rect x="932" y="292" width="280" height="86" rx="11" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1072" y="322" text-anchor="middle" class="label">Active(compute) + selected atom</text>
  <text x="1072" y="348" text-anchor="middle" class="small">may be a disjoint participant subset</text>

  <rect x="932" y="410" width="280" height="86" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="1072" y="440" text-anchor="middle" class="label">Active(store) + store engine</text>
  <text x="1072" y="466" text-anchor="middle" class="small">chosen independently of memory owner</text>

  <rect x="190" y="610" width="900" height="62" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="640" y="636" text-anchor="middle" class="label">stage ≠ warp · stage ≠ cycle · stage ≠ buffer version</text>
  <text x="640" y="658" text-anchor="middle" class="small">Warp specialization is one possible StageBinding after dependence and resource proofs.</text>
</svg>
