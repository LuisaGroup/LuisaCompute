<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Shared Tile SSA remains logical until target resource planning</title>
  <desc id="desc">A multi-consumer Tile SSA definition is preserved by structural lowering. Target planning may legally recompute it or materialize it into a bounded resource after ownership and capacity checks. Correctness-checked JIT measurement ranks the legal alternatives. Explicit user Memory remains a separate addressable object.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 650; }
      .label { font-size: 16px; }
      .small { font-size: 14px; fill: #475569; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect x="10" y="10" width="1180" height="630" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="49" text-anchor="middle" class="title">Preserve semantic sharing; choose physical storage per target</text>

  <rect x="45" y="91" width="330" height="184" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="65" y="124" class="heading">Candidate TileIR / structural TIRx</text>
  <text x="65" y="157" class="label">%combined = add %x, %residual</text>
  <text x="65" y="186" class="label">%mean = reduce %combined</text>
  <text x="65" y="215" class="label">%centered = sub %combined, %mean</text>
  <text x="65" y="244" class="small">One definition, several typed SSA uses</text>

  <rect x="435" y="79" width="330" height="146" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="455" y="112" class="heading">Plan A: recompute / fuse</text>
  <text x="455" y="143" class="label">Inline the pure producer at each use</text>
  <text x="455" y="172" class="small">No temporary; may duplicate loads and ALU</text>
  <text x="455" y="199" class="small">Measured CPU choice for this workload</text>

  <rect x="435" y="249" width="330" height="166" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="455" y="282" class="heading">Plan B: materialize</text>
  <text x="455" y="313" class="label">Map value ownership to a resource</text>
  <text x="455" y="342" class="label">Metal: bounded private worker stripes</text>
  <text x="455" y="371" class="small">Fewer global reads; finite live state</text>
  <text x="455" y="398" class="small">Measured Metal choice for this workload</text>

  <path d="M375 151 L435 151" class="edge"/>
  <path d="M375 215 L405 215 L405 332 L435 332" class="edge"/>

  <rect x="825" y="122" width="330" height="240" rx="10" class="box"/>
  <text x="845" y="155" class="heading">Proof and capacity firewall</text>
  <text x="845" y="188" class="label">• pure and safely duplicable?</text>
  <text x="845" y="219" class="label">• use/alias/effect legality?</text>
  <text x="845" y="250" class="label">• owner coordinate correspondence?</text>
  <text x="845" y="281" class="label">• target can access resource?</text>
  <text x="845" y="312" class="label">• stripe/live-state budget satisfied?</text>
  <text x="845" y="342" class="small">Unknown or over-budget candidates fail closed</text>
  <path d="M765 151 L825 188" class="edge"/>
  <path d="M765 332 L825 293" class="edge"/>

  <rect x="825" y="424" width="330" height="106" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="845" y="457" class="heading">Cost ranking + staged/JIT</text>
  <text x="845" y="487" class="label">Recapture, compile, validate, measure</text>
  <text x="845" y="514" class="small">Timing ranks legal plans; it cannot legalize one</text>
  <path d="M990 362 L990 424" class="edge"/>

  <rect x="45" y="464" width="500" height="112" rx="10" class="box"/>
  <text x="65" y="497" class="heading">Explicit user Memory is a different contract</text>
  <text x="65" y="528" class="label">Stable addressable identity, declared lifetime, explicit .store()</text>
  <text x="65" y="555" class="small">The planner may not erase it into an ordinary Tile SSA cache.</text>
  <path d="M210 275 L210 464" class="dashed"/>

  <text x="600" y="613" text-anchor="middle" class="small">SSA use count records opportunity. Resource planning chooses recomputation, retention, placement, and versioning.</text>
</svg>
