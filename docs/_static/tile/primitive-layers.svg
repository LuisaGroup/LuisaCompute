<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">Library, minimal core, and target atom layers</title>
  <desc id="desc">A broad ergonomic C++ Tile library expands into a small stable TileIR core. Target-specific atoms replace proved core subgraphs without changing reference semantics. Only irreducible observable semantics or effects are admitted to the core.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; fill: #475569; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #8b5cf6; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="10" y="10" width="1260" height="660" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="640" y="50" text-anchor="middle" class="title">A rich library over a deliberately small semantic core</text>
  <text x="640" y="76" text-anchor="middle" class="small">Hardware specialization normally adds an atom and proof, not a new language entity</text>

  <rect x="80" y="108" width="1120" height="138" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="110" y="140" class="heading">C++ TILE LIBRARY</text>
  <text x="1170" y="140" text-anchor="end" class="small">ergonomic · extensible · target-independent reference semantics</text>

  <rect x="116" y="164" width="132" height="48" rx="24" fill="#ffffff" stroke="#60a5fa"/>
  <text x="182" y="194" text-anchor="middle" class="label">GELU / norm</text>
  <rect x="266" y="164" width="132" height="48" rx="24" fill="#ffffff" stroke="#60a5fa"/>
  <text x="332" y="194" text-anchor="middle" class="label">matmul / conv</text>
  <rect x="416" y="164" width="132" height="48" rx="24" fill="#ffffff" stroke="#60a5fa"/>
  <text x="482" y="194" text-anchor="middle" class="label">softmax</text>
  <rect x="566" y="164" width="132" height="48" rx="24" fill="#ffffff" stroke="#60a5fa"/>
  <text x="632" y="194" text-anchor="middle" class="label">Top-K / sort</text>
  <rect x="716" y="164" width="132" height="48" rx="24" fill="#ffffff" stroke="#60a5fa"/>
  <text x="782" y="194" text-anchor="middle" class="label">scan / histogram</text>
  <rect x="866" y="164" width="132" height="48" rx="24" fill="#ffffff" stroke="#60a5fa"/>
  <text x="932" y="194" text-anchor="middle" class="label">gather / scatter</text>
  <rect x="1016" y="164" width="132" height="48" rx="24" fill="#ffffff" stroke="#60a5fa"/>
  <text x="1082" y="194" text-anchor="middle" class="label">copy</text>

  <path d="M640 246 L640 286" class="arrow"/>
  <text x="660" y="272" class="small">reference expansion</text>

  <rect x="80" y="288" width="1120" height="166" rx="16" fill="#f0fdf4" stroke="#10b981" stroke-width="3"/>
  <text x="110" y="321" class="heading">MINIMAL CANDIDATE TILEIR CORE</text>
  <text x="1170" y="321" text-anchor="end" class="small">stable · transformable · fully interpretable</text>

  <rect x="116" y="346" width="302" height="76" rx="12" fill="#ffffff" stroke="#34d399"/>
  <text x="267" y="374" text-anchor="middle" class="label">structured regions</text>
  <text x="267" y="400" text-anchor="middle" class="code">parallel · serial · pipeline · reduce</text>

  <rect x="438" y="346" width="302" height="76" rx="12" fill="#ffffff" stroke="#34d399"/>
  <text x="589" y="374" text-anchor="middle" class="label">values and indexing</text>
  <text x="589" y="400" text-anchor="middle" class="code">scalar · aggregate · reindex · mma</text>

  <rect x="760" y="346" width="388" height="76" rx="12" fill="#ffffff" stroke="#34d399"/>
  <text x="954" y="374" text-anchor="middle" class="label">addressable effects</text>
  <text x="954" y="400" text-anchor="middle" class="code">view · load/store/atomic/sync · Memory</text>

  <path d="M470 454 L470 510" class="arrow"/>
  <text x="490" y="486" class="small">pattern + equivalence proof</text>
  <path d="M810 510 C810 478 940 478 940 454" class="dash"/>
  <text x="902" y="490" text-anchor="middle" class="small">fallback stays executable</text>

  <rect x="160" y="512" width="760" height="112" rx="16" fill="#faf5ff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="190" y="546" class="heading">SCHEDULED / MACHINE TILEIR TARGET ATOMS</text>
  <text x="190" y="574" class="code">atom.call(catalog_id, operands, attrs)</text>
  <text x="190" y="598" class="small">target MMA · async transfer · shuffle reduce · barrier · sort network · tensor-memory op</text>
  <text x="190" y="616" class="small">capability guards + operand layouts + effects + cost + reference-equivalence witness</text>

  <rect x="950" y="512" width="250" height="112" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1075" y="546" text-anchor="middle" class="heading">Core admission gate</text>
  <text x="1075" y="572" text-anchor="middle" class="small">irreducible semantics/effect,</text>
  <text x="1075" y="594" text-anchor="middle" class="small">or lost legality contract?</text>
  <text x="1075" y="614" text-anchor="middle" class="small">otherwise keep it out</text>

  <text x="640" y="651" text-anchor="middle" class="label">A convenient API is cheap. A permanent IR concept must earn its existence.</text>
</svg>
