<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Execution mapping: legality, ranking, and measurement</title>
  <desc id="desc">The TileIR execution tree and target capabilities define supported legal realizations. Search and a cost model rank them. The emitter verifies the selected plan again, then JIT correctness and timing measurements calibrate the cost model without changing semantic constraints.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 650; }
      .label { font-size: 16px; }
      .small { font-size: 14px; fill: #475569; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="10" y="10" width="1180" height="630" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="49" text-anchor="middle" class="title">Find a good implementation of the existing execution structure</text>

  <rect x="45" y="85" width="320" height="112" rx="10" class="box"/>
  <text x="65" y="116" class="heading">Semantic facts</text>
  <text x="65" y="143" class="label">nest + layouts + value/effect graph</text>
  <text x="65" y="173" class="small">Typed identities; labels are not contracts</text>
  <rect x="45" y="221" width="320" height="112" rx="10" class="box"/>
  <text x="65" y="252" class="heading">Target and emitter capabilities</text>
  <text x="65" y="279" class="label">participants, resources, atoms, limits</text>
  <text x="65" y="309" class="small">Only search what can actually be emitted</text>

  <rect x="430" y="135" width="320" height="150" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="590" y="166" text-anchor="middle" class="heading">Legal realization family</text>
  <text x="590" y="194" text-anchor="middle" class="label">binding + distribution + resources</text>
  <text x="590" y="220" text-anchor="middle" class="label">atom + temporal schedule</text>
  <text x="590" y="255" text-anchor="middle" class="small">Integer coverage / capacity / dependence</text>
  <path d="M365 141 L399 141 L399 180 L430 180" class="edge"/>
  <path d="M365 277 L399 277 L399 240 L430 240" class="edge"/>

  <rect x="815" y="135" width="335" height="150" rx="10" fill="#f0fdf4" stroke="#86bfa0" stroke-width="2"/>
  <text x="835" y="166" class="heading">Search + cost ranking</text>
  <text x="835" y="194" class="label">Today: enumeration + Pareto DP</text>
  <text x="835" y="220" class="label">Later: MILP / beam / annealing</text>
  <text x="835" y="255" class="small">Best model score ≠ best measured time</text>
  <path d="M750 208 L815 208" class="edge"/>

  <rect x="815" y="362" width="335" height="100" rx="10" class="box"/>
  <text x="835" y="393" class="heading">Realize and verify again</text>
  <text x="835" y="422" class="label">native C++ TIRx to target code</text>
  <text x="835" y="446" class="small">Reject stale or unsupported plans</text>
  <path d="M982 285 L982 362" class="edge"/>

  <rect x="430" y="362" width="320" height="100" rx="10" class="box"/>
  <text x="450" y="393" class="heading">Correctness + JIT measurements</text>
  <text x="450" y="422" class="label">raw samples, multiple shapes</text>
  <text x="450" y="446" class="small">Separate cold JIT from warm execution</text>
  <path d="M815 412 L750 412" class="edge"/>

  <rect x="45" y="362" width="320" height="100" rx="10" class="box"/>
  <text x="65" y="393" class="heading">Calibrated model + uncertainty</text>
  <text x="65" y="422" class="label">work, traffic, pressure, concurrency</text>
  <text x="65" y="446" class="small">Device / compiler / timing-specific</text>
  <path d="M430 412 L365 412" class="edge"/>
  <path d="M205 462 L205 520 L1170 520 L1170 258 L1150 258" class="edge"/>
  <text x="600" y="549" text-anchor="middle" class="small">Measurement changes profitability estimates, never legality.</text>
  <text x="600" y="595" text-anchor="middle" class="label">The DSL stays execution-first. The planner chooses maps, resources, and schedules.</text>
</svg>
