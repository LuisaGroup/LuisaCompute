<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Four core structured region constructors</title>
  <desc id="desc">Parallel extends the spatial participant prefix. Serial extends a totally ordered temporal path. Pipeline extends time with a producer consumer stage graph. Reduce yields the same kind of scope handle over an algebraic domain while outer Tile states are inferred from captured updates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 18px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; }
      .small { font-size: 12px; fill: #475569; }
      .link { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="10" y="10" width="1260" height="740" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="640" y="50" text-anchor="middle" class="title">Four core regions, one range-for capture protocol</text>
  <text x="640" y="76" text-anchor="middle" class="small">Base context C = (spatial prefix P, temporal path T); reduce adds a lexical algebraic domain R</text>

  <rect x="470" y="98" width="340" height="62" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="640" y="124" text-anchor="middle" class="heading">Parent execution context</text>
  <text x="640" y="147" text-anchor="middle" class="label">C = (P, T)</text>

  <path d="M540 160 C460 190 240 177 170 220" class="link"/>
  <path d="M610 160 C575 190 500 185 475 220" class="link"/>
  <path d="M670 160 C705 190 780 185 805 220" class="link"/>
  <path d="M740 160 C820 190 1040 177 1110 220" class="link"/>

  <rect x="30" y="222" width="285" height="278" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="172" y="258" text-anchor="middle" class="heading">parallel</text>
  <text x="172" y="286" text-anchor="middle" class="code">nest.parallel(I, exec?)</text>
  <rect x="56" y="315" width="233" height="50" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="172" y="346" text-anchor="middle" class="label">(P, T) → (P ▷ I, T)</text>
  <text x="172" y="400" text-anchor="middle" class="label">independent logical children</text>
  <text x="172" y="426" text-anchor="middle" class="small">extends spatial owner prefix</text>
  <text x="172" y="451" text-anchor="middle" class="small">binding inferred or constrained</text>
  <text x="172" y="476" text-anchor="middle" class="small">no sibling order or carry</text>

  <rect x="340" y="222" width="285" height="278" rx="16" fill="#f0fdf4" stroke="#10b981" stroke-width="3"/>
  <text x="482" y="258" text-anchor="middle" class="heading">serial</text>
  <text x="482" y="286" text-anchor="middle" class="code">nest.serial(I, order?)</text>
  <rect x="366" y="315" width="233" height="50" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text x="482" y="346" text-anchor="middle" class="label">(P, T) → (P, T ▷ I)</text>
  <text x="482" y="400" text-anchor="middle" class="label">strictly ordered recurrence</text>
  <text x="482" y="426" text-anchor="middle" class="small">arbitrary loop-carried state</text>
  <text x="482" y="451" text-anchor="middle" class="small">extends temporal path</text>
  <text x="482" y="476" text-anchor="middle" class="small">not freely reassociated</text>

  <rect x="655" y="222" width="285" height="278" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="797" y="258" text-anchor="middle" class="heading">pipeline</text>
  <text x="797" y="286" text-anchor="middle" class="code">nest.pipeline(I, policy)</text>
  <rect x="681" y="315" width="233" height="50" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="797" y="346" text-anchor="middle" class="label">(P, T) → (P, T ▷ stages)</text>
  <text x="797" y="400" text-anchor="middle" class="label">producer / consumer graph</text>
  <text x="797" y="426" text-anchor="middle" class="small">fixed-distance dependences</text>
  <text x="797" y="451" text-anchor="middle" class="small">iterations may overlap</text>
  <text x="797" y="476" text-anchor="middle" class="small">stage cuts are optional</text>

  <rect x="965" y="222" width="285" height="278" rx="16" fill="#faf5ff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="1107" y="258" text-anchor="middle" class="heading">reduce</text>
  <text x="1107" y="286" text-anchor="middle" class="code">nest.reduce(R, contract?)</text>
  <rect x="991" y="315" width="233" height="50" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1107" y="346" text-anchor="middle" class="label">(P, T) + R → (P, T)</text>
  <text x="1107" y="400" text-anchor="middle" class="label">associative state fold</text>
  <text x="1107" y="426" text-anchor="middle" class="small">R can map to space + time</text>
  <text x="1107" y="451" text-anchor="middle" class="small">does not extend owner prefix</text>
  <text x="1107" y="476" text-anchor="middle" class="small">outer Tile states are inferred</text>

  <path d="M172 500 C172 545 292 548 365 578" class="link"/>
  <path d="M482 500 C482 535 470 548 452 578" class="link"/>
  <path d="M797 500 C797 535 810 548 828 578" class="link"/>
  <path d="M1107 500 C1107 545 987 548 914 578" class="link"/>

  <rect x="190" y="580" width="390" height="112" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="385" y="614" text-anchor="middle" class="heading">Spatial projection P</text>
  <text x="385" y="644" text-anchor="middle" class="label">ownership · visibility · participant binding</text>
  <text x="385" y="670" text-anchor="middle" class="small">only parallel creates a new prefix cut</text>

  <rect x="700" y="580" width="390" height="112" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  <text x="895" y="614" text-anchor="middle" class="heading">Temporal / algebraic projection T + R</text>
  <text x="895" y="644" text-anchor="middle" class="label">issue time · recurrence · fold placement</text>
  <text x="895" y="670" text-anchor="middle" class="small">materialization and versions remain derived</text>
</svg>
